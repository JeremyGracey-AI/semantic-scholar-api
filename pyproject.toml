[project]
name = "semantic-scholar-api"
version = "0.1.0"
description = "Semantic Scholar API client + runnable examples (Graph, Recommendations, Datasets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "marimo>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# marimo cells output via bare trailing expressions
"notebooks/*" = ["B018"]

[tool.pyright]
include = ["src", "examples", "tests", "notebooks", "smoke.py"]
typeCheckingMode = "standard"

[[tool.pyright.executionEnvironments]]
# marimo cells output via bare trailing expressions
root = "notebooks"
reportUnusedExpression = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
